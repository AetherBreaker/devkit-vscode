name: "Verify: typecheck, tests, extension build"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # esbuild strips types without checking them, so `typecheck` is the only type check.
  extension:
    name: "Extension: npm ci, typecheck, test, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test

      - name: npm run build
        run: npm run build
